version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=ssr_dev;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/StudentServiceRequest.Web:/app/src
    command: ["dotnet", "watch", "run", "--project", "src/StudentServiceRequest.Web", "--urls", "http://0.0.0.0:8080"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ssr_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: